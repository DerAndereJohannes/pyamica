name: Release & Publish

on:
    pull_request:
    push:
        tags: ["v*"]

permissions:
    contents: read
    id-token: write

jobs:
    # --- STAGE 1: Build (all PRs & tags) ---
    build:
        name: Build Package
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - uses: astral-sh/setup-uv@v5

            - name: Build
              run: uv build

            - name: Upload dist
              uses: actions/upload-artifact@v4
              with:
                  name: dist
                  path: dist/

    # --- STAGE 2: Production Release (tags only) ---
    publish:
        name: Publish to PyPI
        needs: build
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        environment:
            name: pypi
            url: https://pypi.org/p/pyamica
        steps:
            - name: Download dist
              uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: dist/

            - name: Publish to PyPI
              uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  verbose: true
